# H2 in-memory com modo PostgreSQL para compatibilidade com UUID e gen_random_uuid()
spring.datasource.url=jdbc:h2:mem:regulacao_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=regulacao

# Flyway desabilitado nos testes — JPA cria o schema via ddl-auto
spring.flyway.enabled=false

# RabbitMQ — desabilitado nos testes unitários
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

jwt.secret=test-secret-key-must-be-at-least-32-chars!!

logging.level.br.com.morbus=DEBUG
logging.level.org.springframework.security=WARN
