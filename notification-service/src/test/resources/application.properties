# ── Datasource de teste (H2 in-memory) ──────────────────────────────────────
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.database.generation=drop-and-create

# ── Mensageria: desabilita completamente RabbitMQ nos testes ─────────────────
# Impede o Testcontainers de subir um container de RabbitMQ
%test.quarkus.rabbitmq.devservices.enabled=false
# Namespace do Quarkus (não mp.*) para desabilitar o canal
%test.quarkus.messaging.incoming.queue-events.enabled=false
%test.quarkus.messaging.incoming.solicitation-denied-events.enabled=false
%test.quarkus.messaging.incoming.solicitation-devolved-events.enabled=false
%test.quarkus.messaging.incoming.appointment-confirmed-events.enabled=false
%test.quarkus.messaging.incoming.appointment-no-slot-events.enabled=false
