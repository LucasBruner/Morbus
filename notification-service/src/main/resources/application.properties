mp.messaging.incoming.solicitation-devolved-events.exchange.type=direct
mp.messaging.incoming.solicitation-devolved-events.routing-keys=solicitation.devolved

mp.messaging.incoming.appointment-confirmed-events.connector=smallrye-rabbitmq
mp.messaging.incoming.appointment-confirmed-events.queue.name=notification.appointment.confirmed
mp.messaging.incoming.appointment-confirmed-events.exchange.name=sus.agendamento.exchange
mp.messaging.incoming.appointment-confirmed-events.exchange.type=direct
mp.messaging.incoming.appointment-confirmed-events.routing-keys=appointment.confirmed

mp.messaging.incoming.appointment-no-slot-events.connector=smallrye-rabbitmq
mp.messaging.incoming.appointment-no-slot-events.queue.name=notification.appointment.no_slot
mp.messaging.incoming.appointment-no-slot-events.exchange.name=sus.agendamento.exchange
mp.messaging.incoming.appointment-no-slot-events.exchange.type=direct
mp.messaging.incoming.appointment-no-slot-events.routing-keys=appointment.no_slot

mp.messaging.incoming.appointment-rescheduled-events.connector=smallrye-rabbitmq
mp.messaging.incoming.appointment-rescheduled-events.queue.name=notification.appointment.rescheduled
mp.messaging.incoming.appointment-rescheduled-events.exchange.name=sus.agendamento.exchange
mp.messaging.incoming.appointment-rescheduled-events.exchange.type=direct
mp.messaging.incoming.appointment-rescheduled-events.routing-keys=appointment.rescheduled

mp.messaging.incoming.appointment-cancelled-events.connector=smallrye-rabbitmq
mp.messaging.incoming.appointment-cancelled-events.queue.name=notification.appointment.cancelled
mp.messaging.incoming.appointment-cancelled-events.exchange.name=sus.agendamento.exchange
mp.messaging.incoming.appointment-cancelled-events.exchange.type=direct
mp.messaging.incoming.appointment-cancelled-events.routing-keys=appointment.cancelled

mp.messaging.incoming.appointment-expired-events.connector=smallrye-rabbitmq
mp.messaging.incoming.appointment-expired-events.queue.name=notification.appointment.expired
mp.messaging.incoming.appointment-expired-events.exchange.name=sus.agendamento.exchange
mp.messaging.incoming.appointment-expired-events.exchange.type=direct
mp.messaging.incoming.appointment-expired-events.routing-keys=appointment.expired

%prod.quarkus.log.level=INFO
%prod.quarkus.log.category."br.com.sus".level=INFO

%prod.quarkus.swagger-ui.always-include=true

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.database.default-schema=notification

quarkus.smallrye-openapi.path=/v3/api-docs
quarkus.swagger-ui.path=/q/swagger-ui
