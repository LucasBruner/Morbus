quarkus.application.name=notification-service
quarkus.http.port=8081

%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=sus_user
%dev.quarkus.datasource.password=sus_pass
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/sus_queue_db

%dev.camel.component.spring-rabbitmq.connection-factory.host=localhost
%dev.camel.component.spring-rabbitmq.connection-factory.port=5672
%dev.camel.component.spring-rabbitmq.connection-factory.username=admin
%dev.camel.component.spring-rabbitmq.connection-factory.password=admin

%dev.quarkus.mailer.mock=true

%dev.quarkus.log.level=INFO
%dev.quarkus.log.category."br.com.sus".level=DEBUG

%dev.quarkus.swagger-ui.always-include=true

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:sus_user}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:sus_pass}
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://postgres:5432/sus_queue_db}

%prod.camel.component.spring-rabbitmq.connection-factory.host=${RABBITMQ_HOST:rabbitmq}
%prod.camel.component.spring-rabbitmq.connection-factory.port=${RABBITMQ_PORT:5672}
%prod.camel.component.spring-rabbitmq.connection-factory.username=${RABBITMQ_USERNAME:admin}
%prod.camel.component.spring-rabbitmq.connection-factory.password=${RABBITMQ_PASSWORD:admin}

%prod.quarkus.mailer.mock=true

%prod.quarkus.log.level=INFO
%prod.quarkus.log.category."br.com.sus".level=INFO

%prod.quarkus.swagger-ui.always-include=true

quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.sql-load-script=no-file

quarkus.smallrye-openapi.path=/v3/api-docs
quarkus.swagger-ui.path=/q/swagger-ui
