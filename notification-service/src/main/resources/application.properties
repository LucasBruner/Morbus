quarkus.application.name=notification-service
quarkus.http.port=8081

%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=sus_user
%dev.quarkus.datasource.password=sus_pass
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/sus_queue_db

%dev.rabbitmq-host=localhost
%dev.rabbitmq-port=5672
%dev.rabbitmq-username=guest
%dev.rabbitmq-password=guest

%dev.mp.messaging.incoming.queue-events.host=${rabbitmq-host}
%dev.mp.messaging.incoming.queue-events.port=${rabbitmq-port}
%dev.mp.messaging.incoming.queue-events.username=${rabbitmq-username}
%dev.mp.messaging.incoming.queue-events.password=${rabbitmq-password}

%dev.quarkus.log.level=INFO
%dev.quarkus.log.category."br.com.sus".level=DEBUG

%dev.quarkus.swagger-ui.always-include=true

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:sus_user}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:sus_pass}
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://postgres:5432/sus_queue_db}
%prod.mp.messaging.incoming.queue-events.host=${RABBITMQ_HOST:rabbitmq}
%prod.mp.messaging.incoming.queue-events.port=${RABBITMQ_PORT:5672}
%prod.mp.messaging.incoming.queue-events.username=${RABBITMQ_USERNAME:admin}
%prod.mp.messaging.incoming.queue-events.password=${RABBITMQ_PASSWORD:admin}

mp.messaging.incoming.queue-events.connector=smallrye-rabbitmq
mp.messaging.incoming.queue-events.queue.name=queue-events
mp.messaging.incoming.queue-events.exchange.name=morbus.exchange
mp.messaging.incoming.queue-events.routing-keys=queue.patient.registered,queue.patient.called,queue.priority.updated,queue.patient.cancelled

%prod.quarkus.log.level=INFO
%prod.quarkus.log.category."br.com.sus".level=INFO

%prod.quarkus.swagger-ui.always-include=true

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.sql-load-script=no-file

quarkus.smallrye-openapi.path=/v3/api-docs
quarkus.swagger-ui.path=/q/swagger-ui
