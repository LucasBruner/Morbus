mp.messaging.incoming.queue-events.connector=smallrye-rabbitmq
mp.messaging.incoming.queue-events.queue.name=notification.queue.events
mp.messaging.incoming.queue-events.exchange.name=sus.queue.exchange
mp.messaging.incoming.queue-events.exchange.type=direct
mp.messaging.incoming.queue-events.routing-keys=patient.registered,patient.called,priority.updated,patient.cancelled,patient.reinstated

mp.messaging.incoming.solicitation-denied-events.connector=smallrye-rabbitmq
mp.messaging.incoming.solicitation-denied-events.queue.name=notification.solicitation.denied
mp.messaging.incoming.solicitation-denied-events.exchange.name=sus.regulacao.exchange
mp.messaging.incoming.solicitation-denied-events.exchange.type=direct
mp.messaging.incoming.solicitation-denied-events.routing-keys=solicitation.denied

mp.messaging.incoming.solicitation-devolved-events.connector=smallrye-rabbitmq
mp.messaging.incoming.solicitation-devolved-events.queue.name=notification.solicitation.devolved
