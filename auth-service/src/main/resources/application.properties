spring.application.name=auth-service
server.port=8082

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sus_queue_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sus_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sus_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true