# ── Datasource (H2 em memória — sem precisar do PostgreSQL rodando) ────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA ────────────────────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ── Flyway desabilitado (migrations usam gen_random_uuid() do Postgres) ────────
spring.flyway.enabled=false

# ── RabbitMQ desabilitado — sem broker rodando nos testes ─────────────────────
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# ── JWT ────────────────────────────────────────────────────────────────────────
jwt.secret=test-secret-key-with-at-least-256-bits-for-hmac-sha256-ok!!

# ── RFC 7807 ───────────────────────────────────────────────────────────────────
spring.mvc.problemdetails.enabled=true
