# ── Datasource (H2 em memória — sem precisar do PostgreSQL rodando) ────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA ────────────────────────────────────────────────────────────────────────
# H2Dialect é auto-detectado pelo Hibernate 7; não precisa declará-lo explicitamente
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Limpa o default_schema=queue do main/application.properties — H2 não tem esse schema
spring.jpa.properties.hibernate.default_schema=

# ── Flyway desabilitado (migrations usam gen_random_uuid() do Postgres) ────────
spring.flyway.enabled=false

# ── RabbitMQ desabilitado — sem broker rodando nos testes ─────────────────────
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# ── JWT ────────────────────────────────────────────────────────────────────────
jwt.secret=test-secret-key-with-at-least-256-bits-for-hmac-sha256-ok!!

# ── RFC 7807 ───────────────────────────────────────────────────────────────────
spring.mvc.problemdetails.enabled=true
