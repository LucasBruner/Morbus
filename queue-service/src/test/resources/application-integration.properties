# ── Datasource — PostgreSQL real (Testcontainers injetará a URL via @ServiceConnection) ──
# Limpa as configurações H2 do application.properties base
spring.datasource.url=
spring.datasource.driver-class-name=
spring.datasource.username=
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=queue

# ── Flyway — habilitado para IT: executa migrations reais no container ────────────
spring.flyway.enabled=true
spring.flyway.default-schema=queue
spring.flyway.schemas=queue
spring.flyway.locations=classpath:db/migration

# ── RabbitMQ — habilita auto-configuração (sobrepõe a exclusão do application.properties base) ──
spring.autoconfigure.exclude=

# ── JWT ────────────────────────────────────────────────────────────────────────────
jwt.secret=integration-test-secret-key-256bits-for-hmac-sha256-morbus!!

# ── RFC 7807 ───────────────────────────────────────────────────────────────────────
spring.mvc.problemdetails.enabled=true
